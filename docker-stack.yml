version: "3.8"
services:
  backend:
    image: 952312426922.dkr.ecr.us-east-1.amazonaws.com/splitshelf-backend:latest
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=*
      - S3_BUCKET=splitshelf-uploads
      - AWS_REGION=us-east-1
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: splitshelf-backend
        awslogs-create-group: "true"
    networks: [appnet]

  frontend:
    image: 952312426922.dkr.ecr.us-east-1.amazonaws.com/splitshelf-frontend:latest
    ports:
      - "80:80"
    deploy:
      replicas: 1
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: splitshelf-frontend
        awslogs-create-group: "true"
    networks: [appnet]

networks:
  appnet:
    driver: overlay


